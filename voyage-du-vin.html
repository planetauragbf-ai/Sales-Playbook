<title>Le Voyage du Vin</title>
<style>
/* Film motion design plein écran : 11 plans, travellings vers la droite, fondus enchaînés.
   Aucun texte. Clic ou touche espace : pause / lecture. */
:root{--ink:#0c0a08;--gold:#c99e57;color-scheme:dark}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ink);overflow:hidden}

.stage{position:fixed;inset:0;background:var(--ink)}
video{width:100%;height:100%;object-fit:cover;display:block}

/* ligne de progression du film */
.progress{
  position:fixed;left:0;right:0;bottom:0;z-index:5;height:3px;pointer-events:none;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.progress i{
  display:block;height:3px;background:linear-gradient(90deg,#7c2b3d,var(--gold));
  transform-origin:left center;transform:scaleX(var(--t,0));
}

/* bouton lecture (icône seule) : visible quand le film est en pause */
.play{
  position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,8,.35);border:0;cursor:pointer;padding:0;
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.paused .play{opacity:1;pointer-events:auto}
.play svg{width:84px;height:84px;filter:drop-shadow(0 2px 18px rgba(0,0,0,.7))}
.play:focus-visible{outline:2px solid var(--gold);outline-offset:-6px}
</style>

<div class="stage" id="stage">
  <video id="film" src="film/voyage-du-vin.mp4" poster="photos/01-degustation.jpg"
         autoplay muted loop playsinline preload="auto"
         aria-label="Le voyage d'un carton de vin, du caveau français à Manhattan"></video>
  <button class="play" id="play" aria-label="Lecture">
    <svg viewBox="0 0 84 84" fill="none">
      <circle cx="42" cy="42" r="40" stroke="#c99e57" stroke-width="2.5" fill="rgba(12,10,8,.45)"/>
      <path d="M34 27 L60 42 L34 57 Z" fill="#c99e57"/>
    </svg>
  </button>
</div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<script>
(function(){
  var v = document.getElementById('film');
  var bar = document.getElementById('bar');
  var stage = document.getElementById('stage');
  var play = document.getElementById('play');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function sync(){ document.body.classList.toggle('paused', v.paused); }
  function toggle(){ if (v.paused) { v.play().catch(function(){}); } else { v.pause(); } }

  if (reduced) { v.removeAttribute('autoplay'); v.pause(); }

  v.addEventListener('timeupdate', function(){
    if (v.duration) bar.style.setProperty('--t', v.currentTime / v.duration);
  });
  v.addEventListener('play', sync);
  v.addEventListener('pause', sync);
  stage.addEventListener('click', toggle);
  play.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
  });

  // certains navigateurs bloquent l'autoplay : le bouton lecture prend le relais
  var p = v.play();
  if (p && p.catch) p.catch(function(){ sync(); });
  sync();
})();
</script>
